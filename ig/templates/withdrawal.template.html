<!DOCTYPE HTML>

<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Withdrawal: [%id%] ([%title%])</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="author" content="https://medcom.dk/"/>

  <link href="https://hl7.org/fhir/fhir.css" rel="stylesheet"/>

  <!-- Bootstrap core CSS -->
  <link href="https://hl7.org/fhir/dist-hist/css/bootstrap.css" rel="stylesheet"/>
  <link href="css/bootstrap-fhir.css" rel="stylesheet"/>

  <!-- Project extras -->
  <link href="css/project.css" rel="stylesheet"/>
  <link href="css/pygments-manni.css" rel="stylesheet"/>
  <link href="css/hl7-dk.css" rel="stylesheet"/>
  <link href="css/colors.css" rel="stylesheet"/>

  <!-- Favicons -->
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="ico/apple-touch-icon-144-precomposed.png"/>
  <link rel="apple-touch-icon-precomposed" sizes="114x114" href="ico/apple-touch-icon-114-precomposed.png"/>
  <link rel="apple-touch-icon-precomposed" sizes="72x72" href="ico/apple-touch-icon-72-precomposed.png"/>
  <link rel="apple-touch-icon-precomposed" href="ico/apple-touch-icon-57-precomposed.png"/>
  <link rel="shortcut icon" href="ico/favicon.png"/>
</head>

<body>
  <div id="segment-header" class="segment">
    <div class="container">
      <div id="project-nav">
        <a id="dk-logo" no-external="true" href="http://hl7.dk">
          <img height="71" alt="HL7 DK" src="images/HL7_Denmark.png"/>
        </a>
      </div>
      <div id="family-nav">
        <a id="fhir-logo" no-external="true" href="http://hl7.dk">
          <img height="50" alt="HL7 Denmark" src="images/fhir-logo.png" style="margin-top: 15px;"/>
        </a>
      </div>
      <div id="ig-status">
        <b id="ig-title">[%title%]</b>
      </div>
    </div>
  </div>

  <div id="segment-navbar" class="segment">
    <div id="stripe"> </div>
    <div class="container">
      <nav class="navbar navbar-inverse">
        <div class="container">
          <button data-target=".navbar-inverse-collapse" class="navbar-toggle" data-toggle="collapse" type="button" aria-label="Toggle navigation">
            <span class="icon-bar"> </span>
            <span class="icon-bar"> </span>
            <span class="icon-bar"> </span>
          </button>
          <a class="navbar-brand hidden" href="https://hl7.org/fhir/index.html">FHIR</a>
          <div class="nav-collapse collapse navbar-inverse-collapse">
            <ul class="nav navbar-nav">
              <li><a href="[%history%]">History</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </div>
  </div>

  <div id="segment-content" class="segment">
    <div class="container">
      <div class="row">
        <div class="inner-wrapper">
          <div class="col-12">
            <h2>Withdrawal Notice: [%id%] ([%title%])</h2>
            <p>[%notice%]</p>
            [%desc%]
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="segment-footer" class="segment">
    <div class="container">
      <div class="inner-wrapper">
        <p>
          <span id="ig-footer">[%id%] </span> &reg;&copy; <a style="color: #81BEF7" href="https://hl7.org/fhir">FHIR</a> |
          <a style="color: #81BEF7" rel="license" href="https://hl7.org/fhir/license.html"><img style="border-style: none;" alt="CC0" src="images/cc0.png"/></a>
        </p>
      </div>
    </div>
  </div>

  <div id="segment-post-footer" class="segment hidden">
    <div class="container"> </div>
  </div>

  <!-- Keep spaces inside script elements to prevent empty-tag serialization. -->
  <script src="js/jquery.js"> </script>
  <script src="https://hl7.org/fhir/dist-hist/js/bootstrap.min.js"> </script>
  <script src="js/respond.min.js"> </script>
  <script src="js/fhir.js"> </script>
</body>
</html>
